<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>So Tổng Ngẫu Nhiên - Cái vs Con</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Segoe UI’, Arial, sans-serif;
background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
color: #fff;
}

h1 {
font-size: 1.6em;
margin-bottom: 15px;
text-align: center;
text-shadow: 0 2px 8px rgba(0,0,0,0.5);
letter-spacing: 1px;
}

.board {
display: flex;
width: 100%;
max-width: 900px;
gap: 12px;
margin-bottom: 20px;
}

.side {
flex: 1;
border-radius: 16px;
padding: 18px 10px;
text-align: center;
position: relative;
transition: transform 0.15s ease, box-shadow 0.3s ease;
min-height: 220px;
display: flex;
flex-direction: column;
justify-content: space-between;
}

.side.cai {
background: linear-gradient(160deg, #7f1d1d, #b91c1c);
border: 2px solid #fca5a5;
}

.side.con {
background: linear-gradient(160deg, #1e3a8a, #1d4ed8);
border: 2px solid #93c5fd;
}

.side-label {
font-size: 1.3em;
font-weight: bold;
letter-spacing: 2px;
text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}

.numbers {
font-size: 1.1em;
margin: 10px 0;
min-height: 30px;
letter-spacing: 2px;
opacity: 0.9;
word-break: break-word;
}

.total {
font-size: 3.2em;
font-weight: 900;
text-shadow: 0 3px 10px rgba(0,0,0,0.5);
line-height: 1;
}

.win {
animation: pulseWin 0.8s ease infinite alternate;
box-shadow: 0 0 25px 8px gold;
border-color: gold;
}

@keyframes pulseWin {
from { transform: scale(1); }
to { transform: scale(1.03); }
}

.result-banner {
font-size: 1.4em;
font-weight: bold;
margin: 6px 0 18px 0;
min-height: 30px;
text-align: center;
text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

.controls {
width: 100%;
max-width: 900px;
background: rgba(255,255,255,0.08);
border-radius: 16px;
padding: 16px;
backdrop-filter: blur(4px);
}

.controls h2 {
font-size: 1em;
text-align: center;
margin-bottom: 12px;
opacity: 0.85;
font-weight: normal;
}

.btn-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
}

@media (max-width: 600px) {
.btn-grid { grid-template-columns: repeat(2, 1fr); }
.total { font-size: 2.2em; }
}

button {
padding: 12px 6px;
font-size: 0.95em;
font-weight: bold;
border: none;
border-radius: 10px;
background: linear-gradient(160deg, #f59e0b, #d97706);
color: #1a1a1a;
cursor: pointer;
transition: transform 0.1s ease, background 0.2s ease;
box-shadow: 0 3px 6px rgba(0,0,0,0.3);
}

button:hover {
background: linear-gradient(160deg, #fbbf24, #f59e0b);
transform: translateY(-2px);
}

button:active {
transform: translateY(1px) scale(0.97);
}

.reset-btn {
margin-top: 10px;
width: 100%;
background: linear-gradient(160deg, #4b5563, #374151);
color: #fff;
}

.reset-btn:hover {
background: linear-gradient(160deg, #6b7280, #4b5563);
}
</style>

</head>
<body>

<h1>🎲 SO TỔNG NGẪU NHIÊN — PHE CÁI vs PHE CON 🎲</h1>

<div class="board">
  <div class="side cai" id="side-cai">
    <div class="side-label">PHE CÁI</div>
    <div class="numbers" id="numbers-cai">—</div>
    <div class="total" id="total-cai">0</div>
  </div>
  <div class="side con" id="side-con">
    <div class="side-label">PHE CON</div>
    <div class="numbers" id="numbers-con">—</div>
    <div class="total" id="total-con">0</div>
  </div>
</div>

<div class="result-banner" id="result-banner">Chọn số lệnh để bắt đầu</div>

<div class="controls">
  <h2>BẢNG ĐIỀU KHIỂN — CHỌN TỔNG SỐ LƯỢNG SỐ NGẪU NHIÊN</h2>
  <div class="btn-grid">
    <button onclick="playRound(8)">Tổng 8 số</button>
    <button onclick="playRound(7)">Tổng 7 số</button>
    <button onclick="playRound(6)">Tổng 6 số</button>
    <button onclick="playRound(5)">Tổng 5 số</button>
    <button onclick="playRound(4)">Tổng 4 số</button>
    <button onclick="playRound(3)">Tổng 3 số</button>
    <button onclick="playRound(2)">Tổng 2 số</button>
    <button onclick="playRound(1)">Tổng 1 số</button>
  </div>
  <button class="reset-btn" onclick="resetBoard()">↺ Làm mới bảng</button>
</div>

<script>
  // Sinh ra "count" số ngẫu nhiên từ 1 đến 9 (giống kiểu xóc đĩa / bầu cua)
  function generateNumbers(count) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      arr.push(Math.floor(Math.random() * 9) + 1); // 1-9
    }
    return arr;
  }

  function sum(arr) {
    return arr.reduce((a, b) => a + b, 0);
  }

  function playRound(count) {
    const numsCai = generateNumbers(count);
    const numsCon = generateNumbers(count);

    const totalCai = sum(numsCai);
    const totalCon = sum(numsCon);

    document.getElementById('numbers-cai').textContent =
      `Tổng ${count} số: ` + numsCai.join(' + ');
    document.getElementById('numbers-con').textContent =
      `Tổng ${count} số: ` + numsCon.join(' + ');

    document.getElementById('total-cai').textContent = totalCai;
    document.getElementById('total-con').textContent = totalCon;

    const sideCai = document.getElementById('side-cai');
    const sideCon = document.getElementById('side-con');
    sideCai.classList.remove('win');
    sideCon.classList.remove('win');

    const banner = document.getElementById('result-banner');

    if (totalCai > totalCon) {
      sideCai.classList.add('win');
      banner.textContent = `🏆 PHE CÁI THẮNG! (${totalCai} > ${totalCon})`;
      banner.style.color = '#f87171';
    } else if (totalCon > totalCai) {
      sideCon.classList.add('win');
      banner.textContent = `🏆 PHE CON THẮNG! (${totalCon} > ${totalCai})`;
      banner.style.color = '#60a5fa';
    } else {
      banner.textContent = `🤝 HÒA! Cả hai bên đều bằng ${totalCai}`;
      banner.style.color = '#fbbf24';
    }
  }

  function resetBoard() {
    document.getElementById('numbers-cai').textContent = '—';
    document.getElementById('numbers-con').textContent = '—';
    document.getElementById('total-cai').textContent = '0';
    document.getElementById('total-con').textContent = '0';
    document.getElementById('side-cai').classList.remove('win');
    document.getElementById('side-con').classList.remove('win');
    document.getElementById('result-banner').textContent = 'Chọn số lệnh để bắt đầu';
    document.getElementById('result-banner').style.color = '#fff';
  }
</script>

</body>
</html>
